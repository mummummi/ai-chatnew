<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등 맞춤 AI 인물 대화방</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
        .chat-bg { background-color: #b2c7d9; }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.2); border-radius: 3px; }
        @keyframes pulse-dots {
            0% { content: "."; }
            33% { content: ".."; }
            66% { content: "..."; }
            100% { content: ""; }
        }
        .loading-dots::after { content: "."; animation: pulse-dots 1.5s infinite; }
    </style>
</head>
<body class="h-screen flex items-center justify-center m-0 bg-gray-100">
    <div class="w-full h-full sm:w-[450px] sm:h-[92vh] chat-bg flex flex-col shadow-2xl sm:rounded-3xl overflow-hidden border border-gray-300 relative">
        
        <!-- 상단 헤더 -->
        <div class="bg-white/95 backdrop-blur-sm px-4 py-3 flex items-center justify-between border-b border-gray-200 z-10 shrink-0 shadow-sm">
            <div class="flex items-center space-x-3 max-w-[70%]">
                <div class="w-10 h-10 rounded-full bg-amber-700 flex items-center justify-center text-white font-bold text-lg shadow-inner overflow-hidden border-2 border-amber-500 shrink-0 transition-colors duration-300" id="charAvatar">
                    세
                </div>
                <div class="truncate">
                    <div class="font-bold text-gray-800 flex items-center gap-1 text-[15px] truncate">
                        <span id="charNameDisplay" class="truncate">세종대왕</span>
                        <svg class="w-4 h-4 text-blue-500 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                    </div>
                    <div class="text-[11px] text-gray-500 flex items-center gap-1 truncate">
                        <span class="w-2 h-2 rounded-full bg-green-500 shrink-0"></span>
                        <span id="headerContextDisplay" class="truncate">조선의 제4대 왕</span>
                    </div>
                </div>
            </div>
            <button onclick="toggleSettings()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-full font-bold transition flex items-center gap-1 shadow-sm border border-gray-200 shrink-0">
                ⚙️ 설정
            </button>
        </div>

        <!-- 설정 패널 -->
        <div id="settingsPanel" class="bg-white p-4 border-b border-gray-200 text-sm flex flex-col gap-3 hidden absolute top-[60px] left-0 w-full h-[calc(100%-60px)] z-30 shadow-lg overflow-y-auto">
            <h3 class="font-bold text-lg text-gray-800 border-b pb-2 mb-1">대화 설정</h3>
            <div class="flex gap-2">
                <div class="w-1/2">
                    <label class="font-bold text-gray-700 block mb-1 text-xs">👤 학생 학년</label>
                    <select id="gradeSelect" class="w-full p-2 text-xs border border-gray-300 rounded-md bg-gray-50">
                        <option value="1">초등 1학년</option><option value="2">초등 2학년</option>
                        <option value="3">초등 3학년</option><option value="4" selected>초등 4학년</option>
                        <option value="5">초등 5학년</option><option value="6">초등 6학년</option>
                    </select>
                </div>
                <div class="w-1/2">
                    <label class="font-bold text-gray-700 block mb-1 text-xs">📚 관련 교과</label>
                    <select id="subjectSelect" class="w-full p-2 text-xs border border-gray-300 rounded-md bg-gray-50">
                        <option value="도덕">도덕</option><option value="국어" selected>국어</option>
                        <option value="사회">사회</option><option value="과학">과학</option>
                        <option value="수학">수학</option><option value="실과">실과</option>
                        <option value="창의적 체험활동">창체/기타</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="font-bold text-gray-700 block mb-1 text-xs">🎭 대화할 대상 (인물/동물/사물 모두 가능)</label>
                <input type="text" id="characterInput" value="세종대왕" placeholder="예: 흥부, 이순신, 북극곰, 현미경" class="w-full p-2 text-xs border border-gray-300 rounded-md bg-gray-50 focus:ring-2 focus:ring-amber-400 outline-none">
            </div>
            <div>
                <label class="font-bold text-gray-700 block mb-1 text-xs">📖 대상의 상황 또는 설명 (페르소나 부여)</label>
                <textarea id="contextInput" rows="2" placeholder="예: 지구 온난화로 빙하가 녹아 슬퍼하는 상황, 흥부전에서 제비 다리를 고쳐준 후의 상황 등" class="w-full p-2 text-xs border border-gray-300 rounded-md bg-gray-50 focus:ring-2 focus:ring-amber-400 outline-none resize-none">조선의 제4대 왕이자 훈민정음을 창제한 어진 임금</textarea>
                <p class="text-[10px] text-gray-500 mt-1">상황을 구체적으로 적을수록 AI가 더 실감나게 연기합니다.</p>
            </div>
            <div class="mt-auto pt-4 flex gap-2">
                <button onclick="toggleSettings()" class="w-1/3 bg-gray-200 text-gray-700 py-2.5 rounded-md text-xs font-bold hover:bg-gray-300 transition">취소</button>
                <button onclick="applySettings()" class="w-2/3 bg-amber-500 text-white py-2.5 rounded-md text-xs font-bold hover:bg-amber-600 transition shadow-md">✨ 적용하고 대화 새로 시작</button>
            </div>
        </div>

        <!-- 채팅 메시지 영역 -->
        <div id="chatBox" class="flex-1 p-4 overflow-y-auto chat-scroll flex flex-col space-y-4 pb-4">
            <div class="flex justify-center my-2">
                <span class="bg-black/10 text-white px-3 py-1 rounded-full text-[10px]">오늘 (새로운 만남)</span>
            </div>
            <div class="bg-white/90 border border-amber-200 text-gray-700 p-4 rounded-xl text-xs shadow-sm leading-relaxed mx-2" id="guideBox">
                <div class="font-bold text-amber-700 flex items-center gap-1 mb-2">
                    <span>📜</span> <span id="guideTitle">대화 안내</span>
                </div>
                설정 메뉴(⚙️)를 눌러 대상과 상황을 바꾸고 대화를 시작해 보세요!
            </div>
        </div>

        <!-- 추천 질문 -->
        <div class="bg-white/40 backdrop-blur-md px-2 py-2 flex gap-2 overflow-x-auto chat-scroll scroll-smooth whitespace-nowrap border-t border-white/50" id="suggestionBox">
        </div>

        <!-- 하단 입력 영역 -->
        <div class="bg-white p-3 flex items-center space-x-2 border-t border-gray-200 z-10 shrink-0">
            <input type="text" id="messageInput" placeholder="질문을 입력해보세요..." class="flex-1 bg-gray-100 text-[13px] px-4 py-2.5 rounded-full outline-none focus:bg-gray-200 transition border border-transparent focus:border-gray-300" onkeypress="handleEnter(event)">
            <button onclick="handleUserMessage()" class="bg-[#ffeb33] hover:bg-[#fada0a] text-gray-800 w-9 h-9 rounded-full flex items-center justify-center font-bold shadow-sm transition shrink-0 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:ring-offset-1">
                <svg class="w-5 h-5 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </div>
    </div>

    <script>
        let currentPersona = {
            name: '세종대왕', context: '조선의 제4대 왕이자 훈민정음을 창제한 어진 임금', grade: '4', subject: '국어', colorClass: 'bg-amber-700'
        };
        let currentInteractionId = null;

        function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
        function scrollToBottom() { const chatBox = document.getElementById('chatBox'); chatBox.scrollTop = chatBox.scrollHeight; }
        function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('hidden'); }
        function handleEnter(event) { if (event.key === 'Enter') handleUserMessage(); }
        function getAvatarColor(name) {
            const colors = ['bg-amber-700', 'bg-blue-600', 'bg-green-600', 'bg-purple-600', 'bg-rose-600', 'bg-teal-600', 'bg-indigo-600'];
            let hash = 0; for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        }

        function updateSuggestions(name) {
            const sugBox = document.getElementById('suggestionBox'); sugBox.innerHTML = '';
            let sugs = [];
            if (name.includes('세종')) sugs = ['훈민정음은 왜 만드셨나요?', '제일 좋아하셨던 음식은?', '장영실과는 어떻게 친해지셨나요?'];
            else if (name.includes('이순신')) sugs = ['거북선은 어떻게 만드셨나요?', '명량해전 때 무섭지 않으셨나요?', '가장 기억에 남는 전투는?'];
            else if (name.includes('북극곰') || name.includes('펭귄') || name.includes('동물')) sugs = ['지금 기분이 어때?', '내가 널 위해 무엇을 도와줄까?', '너희 동네는 지금 날씨가 어때?'];
            else if (name.includes('나무') || name.includes('현미경') || name.includes('지구')) sugs = ['넌 어떤 역할을 하니?', '우리에게 해주고 싶은 말이 있어?', '가장 힘들 때는 언제야?'];
            else sugs = ['안녕? 넌 누구야?', '너만의 특별한 점을 알려줘!', '나한테 해주고 싶은 이야기 있어?'];

            sugs.forEach(text => {
                const btn = document.createElement('button');
                btn.onclick = () => { document.getElementById('messageInput').value = text; handleUserMessage(); };
                btn.className = 'bg-white/90 backdrop-blur text-gray-700 px-3 py-1.5 rounded-full text-[11px] border border-gray-300 shadow-sm hover:bg-gray-50 flex items-center gap-1 shrink-0 font-medium';
                btn.innerHTML = `<span class="text-blue-500">💬</span> ${text}`;
                sugBox.appendChild(btn);
            });
        }

        function updateHeaderUI() {
            document.getElementById('charNameDisplay').innerText = currentPersona.name;
            document.getElementById('headerContextDisplay').innerText = currentPersona.context;
            const avatar = document.getElementById('charAvatar');
            avatar.innerText = currentPersona.name.charAt(0);
            avatar.className = `w-10 h-10 rounded-full ${currentPersona.colorClass} flex items-center justify-center text-white font-bold text-lg shadow-inner overflow-hidden border-2 border-white shrink-0 transition-colors duration-300`;
            updateSuggestions(currentPersona.name);
        }

        async function applySettings() {
            const nameInput = document.getElementById('characterInput').value.trim();
            const contextInput = document.getElementById('contextInput').value.trim();
            if (!nameInput) { alert("대화할 대상의 이름을 입력해주세요!"); return; }

            currentPersona = {
                name: nameInput, context: contextInput,
                grade: document.getElementById('gradeSelect').value,
                subject: document.getElementById('subjectSelect').value,
                colorClass: getAvatarColor(nameInput)
            };
            updateHeaderUI(); toggleSettings();
            
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = `<div class="flex justify-center my-2"><span class="bg-black/10 text-white px-3 py-1 rounded-full text-[10px]">새로운 만남 시작</span></div>`;
            currentInteractionId = null; 

            await callBackendAPI("안녕? 나에게 다정하게 첫인사를 건네줘.");
        }

        function appendUserMessage(text) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'flex justify-end mt-2';
            div.innerHTML = `<div class="bg-[#ffeb33] text-gray-900 p-3 rounded-2xl rounded-tr-sm max-w-[240px] text-[13px] shadow-sm leading-relaxed whitespace-pre-wrap word-break break-words">${escapeHtml(text)}</div>`;
            chatBox.appendChild(div); scrollToBottom();
        }

        function appendBotMessage(text, isLoading = false) {
            const chatBox = document.getElementById('chatBox');
            const id = 'msg-' + Date.now();
            const div = document.createElement('div'); div.id = id; div.className = 'flex items-start space-x-2 mt-3';
            let contentHtml = isLoading ? `<span class="loading-dots text-gray-400 font-bold tracking-widest">${text}</span>` : escapeHtml(text).replace(/\n/g, '<br>');
            div.innerHTML = `
                <div class="w-9 h-9 rounded-full ${currentPersona.colorClass} text-white flex items-center justify-center text-sm font-bold shrink-0 mt-1 shadow-sm border border-white/50">${currentPersona.name.charAt(0)}</div>
                <div class="flex flex-col max-w-[75%]">
                    <span class="text-[11px] text-gray-600 mb-1 ml-1 font-medium">${currentPersona.name}</span>
                    <div class="bg-white p-3 rounded-2xl rounded-tl-sm shadow-sm text-[13px] text-gray-800 leading-relaxed border border-gray-100 ${isLoading ? 'animate-pulse' : 'whitespace-pre-wrap word-break break-words'}">${contentHtml}</div>
                </div>`;
            chatBox.appendChild(div); scrollToBottom(); return id;
        }

        async function handleUserMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            if (!message) return;
            appendUserMessage(message); messageInput.value = '';
            await callBackendAPI(message);
        }

        async function callBackendAPI(userMessage) {
            const loadingId = appendBotMessage('생각하는 중', true);
            try {
                // Vercel 서버리스 함수 호출
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: userMessage,
                        persona: currentPersona,
                        interactionId: currentInteractionId
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (!response.ok) throw new Error(data.error || '서버 오류가 발생했습니다.');
                
                appendBotMessage(data.reply);
                currentInteractionId = data.interactionId; // 다음 대화를 위해 ID 저장

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendBotMessage(`앗, 오류가 발생했어.\n\n[상세 오류]\n${error.message}`);
            }
        }

        window.onload = () => { updateHeaderUI(); };
    </script>
</body>
</html>
